## Render Blueprint — deploys the API, the dashboard, and Postgres together.
## Connect this repo at https://dashboard.render.com/blueprints (New + -> Blueprint)
## and Render reads this file automatically.
##
## Free tier notes: the web services sleep after 15 min idle (~1 min cold
## start on the next request), and the free Postgres expires 30 days after
## creation. Fine for a testing window; upgrade both if this needs to run
## longer than that.

databases:
  - name: agent-trust-db
    plan: free
    databaseName: agenttrust
    user: agenttrust

services:
  - type: web
    name: agent-trust-api
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      # Pinned because Render's default (3.14, brand new) has no prebuilt
      # wheel for pydantic-core yet, so pip tries to compile it from Rust
      # source and fails on Render's read-only build filesystem. Also see
      # .python-version at the repo root — belt and braces.
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: agent-trust-db
          property: connectionString
      # Comma-separated storefront origins allowed to post tracker data.
      - key: SITE_ORIGIN
        value: https://icelabs-bdy57pfy.myshopify.com,https://checkskincare.com,https://www.checkskincare.com
      - key: SHOPIFY_STORE_DOMAIN
        value: icelabs-bdy57pfy.myshopify.com
      # Set these two in the Render dashboard after deploy — not committed
      # to the repo. SHOPIFY_WEBHOOK_SECRET comes from Shopify when you
      # create the orders/create webhook (Settings -> Notifications).
      # Each store has its own: comma-separate them, e.g. secret_icelabs,secret_vv
      - key: SHOPIFY_WEBHOOK_SECRET
        sync: false
      - key: SHOPIFY_ADMIN_API_TOKEN
        sync: false
      # Bearer key for /metrics/* (the Shopify app's backend and the internal
      # dashboard send it). Render generates it; copy it from the
      # Environment tab when wiring up a client.
      - key: METRICS_API_KEY
        generateValue: true
      # Store that untagged rows and untagged test runs belong to.
      - key: DEFAULT_SHOP
        value: icelabs-bdy57pfy.myshopify.com
      # Derives each store's edge key (edge/worker.js signs with it). Print a
      # store's key with: python -m scripts.edge_key <shop>
      - key: EDGE_SIGNING_SECRET
        generateValue: true
      # Optional: separate key for encrypting stored integration tokens
      # (Cloudflare). Defaults to one derived from EDGE_SIGNING_SECRET.
      # Changing it means stores must reconnect.
      - key: INTEGRATIONS_KEY
        generateValue: true

  - type: web
    name: agent-trust-dashboard
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "streamlit run dashboard/app.py --server.port $PORT --server.address 0.0.0.0"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: agent-trust-db
          property: connectionString
      # Same secrets as the API, so the Connections page can encrypt
      # Cloudflare tokens the API can read, and show each store's Worker key.
      - key: EDGE_SIGNING_SECRET
        fromService:
          type: web
          name: agent-trust-api
          envVarKey: EDGE_SIGNING_SECRET
      - key: INTEGRATIONS_KEY
        fromService:
          type: web
          name: agent-trust-api
          envVarKey: INTEGRATIONS_KEY
